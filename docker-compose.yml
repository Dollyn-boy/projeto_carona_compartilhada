

services:
  servidor:
    build:
      context: .                          # raiz do repo = contexto do build (o que o COPY . . do Dockerfile enxerga)
      dockerfile: docker/Dockerfile.servidor
    ports:
      - "8080:8080"                       # <porta da maquina hospedeira>:<porta dentro do container>
                                           # necessario para acessar o servidor de FORA do Docker
                                           # (ex: outra maquina do laboratorio, ou um go run local).

  cliente:
    build:
      context: .
      dockerfile: docker/Dockerfile.cliente
    depends_on:
      - servidor                          # garante que o container do servidor SOBE antes,
                                           # mas nao garante que ja esta ESCUTANDO — ver nota no README.
    command: ["-servidor", "servidor:8080"]  # vira argv do ENTRYPOINT do Dockerfile.cliente
    stdin_open: true                      # necessario para o cliente ler input interativo (cadastro/login/menu)
    tty: true
